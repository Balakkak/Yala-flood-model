<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · ศูนย์เฝ้าระวังน้ำท่วมยะลา</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css" integrity="sha384-/Bmojb1H/9dHvtYa2TzEQ1MldjNefaS+t7DcnOYHpP+yer5gvd3LONWEpWhHK+Yo" crossorigin="anonymous">
  <style>
    :root{ --brand:#0284c7; --ink:#0f172a; --line:#e2e8f0; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; font-family:'Sarabun',sans-serif; }
    body{ display:grid; place-items:center;
      background:linear-gradient(125deg,#081c33 0%,#0c3a5e 55%,#0a5a86 100%); position:relative; overflow:hidden; }
    body::after{ content:""; position:absolute; inset:0;
      background:radial-gradient(600px 260px at 100% -10%,rgba(56,189,248,.28),transparent 70%); pointer-events:none; }
    .card{ position:relative; z-index:1; width:360px; max-width:92vw; background:#fff; border-radius:18px;
      box-shadow:0 24px 60px -20px rgba(8,30,50,.6); padding:30px 28px; }
    .logo{ width:52px; height:52px; border-radius:14px; display:grid; place-items:center; margin:0 auto 14px;
      background:linear-gradient(135deg,#5ccbf7,#0284c7); color:#fff; font-size:27px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px rgba(2,132,199,.45); }
    h1{ margin:0 0 2px; text-align:center; font-size:17px; color:var(--ink); }
    .sub{ margin:0 0 20px; text-align:center; font-size:12px; color:#64748b; }
    label{ display:block; font-size:12px; font-weight:600; color:#334155; margin:12px 0 5px; }
    .inp{ position:relative; }
    .inp .ti{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:17px; }
    input{ width:100%; padding:10px 12px 10px 36px; border:1px solid var(--line); border-radius:10px;
      font-family:inherit; font-size:14px; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s; }
    input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(2,132,199,.15); }
    button{ width:100%; margin-top:20px; padding:11px; border:none; border-radius:10px; cursor:pointer;
      background:linear-gradient(135deg,#0ea5e9,#0369a1); color:#fff; font-family:inherit; font-size:14px; font-weight:700;
      display:flex; align-items:center; justify-content:center; gap:7px; transition:transform .12s, box-shadow .12s; }
    button:hover{ transform:translateY(-1px); box-shadow:0 10px 22px -8px rgba(2,132,199,.7); }
    .err{ margin-top:12px; font-size:12.5px; color:#b91c1c; text-align:center; min-height:16px; }
    .note{ margin-top:16px; padding-top:13px; border-top:1px solid var(--line);
      font-size:10.5px; color:#94a3b8; line-height:1.5; text-align:center; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="logo"><i class="ti ti-ripple"></i></div>
    <h1>ศูนย์เฝ้าระวังและจำลองน้ำท่วม</h1>
    <p class="sub">เทศบาลนครยะลา · Yala Flood GIS</p>

    <label for="u">ชื่อผู้ใช้</label>
    <div class="inp"><i class="ti ti-user"></i><input id="u" type="text" autocomplete="username" required></div>

    <label for="p">รหัสผ่าน</label>
    <div class="inp"><i class="ti ti-lock"></i><input id="p" type="password" autocomplete="current-password" required></div>

    <button type="submit"><i class="ti ti-login-2"></i> เข้าสู่ระบบ</button>
    <div class="err" id="err"></div>
    <p class="note"><i class="ti ti-info-circle"></i> ระบบสาธิต — การล็อกอินนี้เป็นด่านฝั่งผู้ใช้เท่านั้น ไม่ใช่ระบบความปลอดภัยจริง</p>
  </form>

  <script>
    // เก็บเป็น SHA-256 ของ "username:password" (ไม่เก็บรหัสผ่านเป็น plaintext ในโค้ด)
    var CRED_HASH = "9794555787d3aea37ddb0537fc539d901b40145b8cc3ab1234ed34fdf98b236d";
    async function sha256(str){
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    // ถ้าล็อกอินไว้แล้ว ข้ามไปหน้าหลัก
    try { if (sessionStorage.getItem("yala_auth") === "1") location.replace("index.html"); } catch (e) {}

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("err"); err.textContent = "";
      var u = document.getElementById("u").value.trim();
      var p = document.getElementById("p").value;
      try {
        var h = await sha256(u + ":" + p);
        if (h === CRED_HASH) {
          sessionStorage.setItem("yala_auth", "1");
          location.replace("index.html");
        } else {
          err.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
        }
      } catch (ex) {
        err.textContent = "เบราว์เซอร์ไม่รองรับการเข้ารหัส (ต้องเปิดผ่าน https หรือ localhost)";
      }
    });
  </script>
</body>
</html>
